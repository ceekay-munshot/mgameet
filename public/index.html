<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meets Tracker</title>
  <style>
    :root { color-scheme: light dark; --bg:#fff; --fg:#0f172a; --muted:#64748b; --card:#f8fafc; --border:#e2e8f0; --accent:#2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0b1120; --fg:#e2e8f0; --muted:#94a3b8; --card:#111827; --border:#1f2937; --accent:#60a5fa; } }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:24px 16px; }
    .wrap { max-width:720px; margin:0 auto; }
    h1 { font-size:20px; margin:0 0 4px; }
    .sub { color:var(--muted); margin:0 0 20px; font-size:13px; }
    .stat { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:12px; }
    .big { font-size:40px; font-weight:700; line-height:1; }
    .lbl { color:var(--muted); font-size:13px; margin-top:4px; }
    ul { list-style:none; padding:0; margin:0; }
    li { padding:10px 0; border-top:1px solid var(--border); font-size:13px; }
    li:first-child { border-top:none; }
    .d { color:var(--accent); font-weight:600; }
    a { color:var(--accent); }
    code { background:var(--card); border:1px solid var(--border); border-radius:6px; padding:1px 6px; font-size:12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📅 Investor Meet Tracker</h1>
    <p class="sub">Data-engine placeholder — the real dashboard ships in Prompt 2. This page just proves the deploy + <code>data/events.json</code> pipeline works.</p>
    <div class="stat">
      <div class="big" id="count">…</div>
      <div class="lbl" id="updated">loading data/events.json…</div>
    </div>
    <div class="stat">
      <div class="lbl" style="margin:0 0 8px">Next few meetings</div>
      <ul id="list"><li>loading…</li></ul>
    </div>
  </div>
  <script>
    (async () => {
      const $ = (id) => document.getElementById(id);
      try {
        const r = await fetch("data/events.json", { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const d = await r.json();
        $("count").textContent = d.count ?? (d.events || []).length ?? 0;
        $("updated").textContent =
          "upcoming events • generated " + (d.generated_at ? new Date(d.generated_at).toLocaleString() : "—");
        const rows = (d.events || []).slice(0, 8);
        $("list").innerHTML = rows.length
          ? rows.map((e) =>
              `<li><span class="d">${e.event_date}</span> — ${e.company || "?"} <em>(${e.event_type || "?"})</em>` +
              (e.counterparty ? " · " + e.counterparty : "") +
              (e.pdf_url ? ` · <a href="${e.pdf_url}" target="_blank" rel="noopener">source</a>` : "") +
              `</li>`
            ).join("")
          : "<li>No upcoming events yet — run the pipeline to populate data.</li>";
      } catch (e) {
        $("count").textContent = "—";
        $("updated").textContent = "No data yet (" + e.message + "). Run: node screener-test/run-pipeline.mjs";
        $("list").innerHTML = "<li>events.json not found.</li>";
      }
    })();
  </script>
</body>
</html>
